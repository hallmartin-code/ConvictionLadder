<!doctype html>
<html lang="${LANG}">
<head>
<meta charset="UTF-8">
<title>${PAGE_TITLE}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950: #0B1526;
    --navy-900: #101E33;
    --navy-800: #16283F;
    --navy-700: #1E354F;
    --accent-1: #EE5A4E;
    --accent-1-soft: #F0776C;
    --accent-2: #F3A22A;
    --accent-3: #35BEBB;
    --ink-100: #F3F6FA;
    --ink-300: #C4D0E0;
    --ink-500: #7E90A8;
    --ink-600: #5C6E86;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--navy-950);
    color: var(--ink-100);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 20px;
    position:relative;
    overflow-x:hidden;
  }

  /* ambient tri-color glow, one bloom per accent */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(480px 380px at 14% 8%, rgba(238,90,78,0.16), transparent 60%),
      radial-gradient(480px 380px at 86% 6%, rgba(243,162,42,0.13), transparent 60%),
      radial-gradient(560px 420px at 50% 100%, rgba(53,190,187,0.14), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 620px;
  }

  /* brand lockup */
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom: 28px;
    padding-left: 4px;
  }

  .brand-mark{
    width:34px; height:34px;
    flex-shrink:0;
  }

  .brand-word{
    font-family:'Sora', sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:0.04em;
    line-height:1.15;
    color: var(--ink-100);
    text-transform:uppercase;
  }
  .brand-word span{
    display:block;
    font-weight:600;
    font-size:10px;
    letter-spacing:0.22em;
    color: var(--ink-500);
    margin-top:2px;
  }

  .card{
    background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
    border: 1px solid var(--navy-700);
    border-radius: 20px;
    padding: 44px 44px 36px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.03);
    position:relative;
    overflow:hidden;
  }

  .card::after{
    content:"";
    position:absolute;
    top:-2px; left:44px; right:44px;
    height:2px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3));
    border-radius: 2px;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--accent-3);
    margin-bottom:14px;
  }
  .eyebrow::before{
    content:"";
    width:6px; height:6px;
    border-radius:50%;
    background: var(--accent-3);
    box-shadow: 0 0 0 3px rgba(53,190,187,0.18);
  }

  h1{
    font-family:'Sora', sans-serif;
    font-size: 28px;
    font-weight:700;
    line-height:1.25;
    margin: 0 0 12px;
    letter-spacing:-0.01em;
  }
  h1 .arrow{
    color: var(--ink-500);
    font-weight:400;
    margin: 0 4px;
  }
  h1 .to{
    background: linear-gradient(90deg, var(--accent-1-soft), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .lede{
    color: var(--ink-300);
    font-size:15px;
    line-height:1.6;
    margin: 0 0 32px;
    max-width: 46ch;
  }

  /* dropzone */
  .dropzone{
    border: 1.5px dashed var(--navy-700);
    border-radius: 14px;
    padding: 38px 24px;
    text-align:center;
    cursor:pointer;
    background: rgba(255,255,255,0.015);
    transition: border-color .18s ease, background .18s ease, transform .18s ease;
  }
  .dropzone:hover{
    border-color: var(--accent-3);
    background: rgba(53,190,187,0.05);
  }
  .dropzone:active{ transform: scale(0.997); }

  .dropzone-icon{
    width:38px; height:38px;
    margin: 0 auto 14px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(238,90,78,0.16), rgba(243,162,42,0.16));
    border: 1px solid var(--navy-700);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .dropzone-icon svg{ width:18px; height:18px; }

  .dropzone-title{
    font-size:15px;
    font-weight:600;
    color: var(--ink-100);
    margin-bottom:6px;
  }
  .dropzone-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color: var(--ink-500);
    letter-spacing:0.01em;
  }
  .dropzone-sub b{ color: var(--ink-300); font-weight:500; }

  .file-input{ display:none; }

  /* CTA */
  .cta{
    width:100%;
    margin-top: 22px;
    padding: 16px 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--accent-1) 0%, var(--accent-1-soft) 45%, var(--accent-2) 100%);
    color: #17130E;
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.01em;
    cursor:pointer;
    transition: filter .15s ease, transform .15s ease;
    box-shadow: 0 10px 24px -10px rgba(238,90,78,0.45);
  }
  .cta:hover{ filter: brightness(1.06); transform: translateY(-1px); }
  .cta:active{ transform: translateY(0); }

  /* footnote / disclosure */
  .disclosure{
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--navy-700);
    font-size: 12px;
    line-height:1.6;
    color: var(--ink-500);
  }
  .disclosure code{
    font-family:'JetBrains Mono', monospace;
    background: var(--navy-950);
    border: 1px solid var(--navy-700);
    color: var(--ink-300);
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 11.5px;
  }

  footer{
    text-align:center;
    margin-top: 22px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing:0.08em;
    color: var(--ink-600);
    text-transform:uppercase;
  }

  @media (max-width: 480px){
    .card{ padding: 32px 24px 28px; }
    h1{ font-size:23px; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="brand">
    ${BRAND_MARK_SVG}
    <div class="brand-word">${BRAND_NAME}<span>${BRAND_SUBTITLE}</span></div>
  </div>

  <div class="card">
    <div class="eyebrow">${EYEBROW}</div>
    <h1>${HEADLINE_PRIMARY}<span class="arrow">&rarr;</span><span class="to">${HEADLINE_ACCENT}</span></h1>
    <p class="lede">${LEDE}</p>

    <label class="dropzone" for="deck-upload">
      <div class="dropzone-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--ink-100)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
          <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/>
        </svg>
      </div>
      <div class="dropzone-title">${DROPZONE_TITLE}</div>
      <div class="dropzone-sub">${ACCEPTED_FORMATS} &nbsp;&middot;&nbsp; <span style="white-space:nowrap">up to ${MAX_UPLOAD}</span></div>
      <input class="file-input" type="file" id="deck-upload" accept="${ACCEPT_ATTR}">
    </label>

    <button class="cta" type="button">${CTA_LABEL}</button>

    <div class="disclosure">${DISCLOSURE}</div>
  </div>

  <footer>${FOOTER}</footer>

</div>

</body>
</html>
